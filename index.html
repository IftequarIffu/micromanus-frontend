<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#c0265a" />

    <title>micromanus — Multi-model chat with your own API keys</title>
    <meta
      name="description"
      content="Chat with GPT, Claude, and Gemini using your own API keys. micromanus streams answers with web citations, PDF tools, and platform credits—no provider markup."
    />
    <meta name="robots" content="index,follow" />
    <!-- Canonical is injected as an absolute same-origin URL by DocumentMeta. -->

    <!-- Open Graph (absolute image URL for crawlers that do not run JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="micromanus" />
    <meta
      property="og:title"
      content="micromanus — Multi-model chat with your own API keys"
    />
    <meta
      property="og:description"
      content="Chat with GPT, Claude, and Gemini using your own API keys. micromanus streams answers with web citations, PDF tools, and platform credits—no provider markup."
    />
    <meta
      property="og:url"
      content="https://micromanus-frontend.vercel.app/login"
    />
    <meta
      property="og:image"
      content="https://micromanus-frontend.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="micromanus — multi-model BYOK chat" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="micromanus — Multi-model chat with your own API keys"
    />
    <meta
      name="twitter:description"
      content="Chat with GPT, Claude, and Gemini using your own API keys. micromanus streams answers with web citations, PDF tools, and platform credits—no provider markup."
    />
    <meta
      name="twitter:image"
      content="https://micromanus-frontend.vercel.app/og-image.png"
    />


    <!-- Favicons / install -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "micromanus",
        "url": "https://micromanus-frontend.vercel.app/login",
        "description": "Multi-model, bring-your-own-key LLM chat with streaming replies, web citations, PDF tools, and platform credits.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <style>
      /* Visible before JS/CSS bundles load (hard reload / OAuth return). */
      #boot-splash {
        box-sizing: border-box;
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #fff;
        color: #0a0f14;
      }
      html.dark #boot-splash {
        background: #0a0f14;
        color: #f4f7f8;
      }
      #boot-splash__mark {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      #boot-splash__spinner {
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid color-mix(in srgb, currentColor 25%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      ;(() => {
        const key = "theme"
        const stored = localStorage.getItem(key)
        const theme =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "dark"
        const resolved =
          theme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme
        document.documentElement.classList.remove("light", "dark")
        document.documentElement.classList.add(resolved)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading">
        <p id="boot-splash__mark">micromanus</p>
        <div id="boot-splash__spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
